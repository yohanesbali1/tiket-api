name: Deploy Staging

on:
  push:
    branches:
      - staging

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: Test
        run: go test -race -v ./...

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: Build
        run: go build -o queue-api ./cmd/server

  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: build

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}

  deploy:
    name: Deploy Docker
    runs-on:
      - self-hosted
      - linux
      - staging

    needs: docker

    environment:
      name: staging

    permissions:
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_REPO: ${{ github.repository }}
          IMAGE_TAG: ${{ github.sha }}

        run: |
          set -e

          echo "======================================"
          echo "Starting staging deployment"
          echo "======================================"

          test -f docker-compose.yml
          test -f /home/yohanesdev/tiketapi/.env

          echo "$GHCR_TOKEN" | docker login ghcr.io \
            --username "$GHCR_USER" \
            --password-stdin

          export IMAGE_REPO
          export IMAGE_TAG

          echo ""
          echo "Image:"
          echo "ghcr.io/${IMAGE_REPO}:${IMAGE_TAG}"

          # ================================================
          # STOP OLD CONTAINERS
          # ================================================
          echo ""
          echo "Stopping old containers..."

          docker compose \
            --env-file /home/yohanesdev/tiketapi/.env \
            down

          # ================================================
          # PULL NEW IMAGE
          # ================================================
          echo ""
          echo "Pulling new image..."

          docker compose \
            --env-file /home/yohanesdev/tiketapi/.env \
            pull

          # ================================================
          # START NEW CONTAINERS
          # ================================================
          echo ""
          echo "Starting new containers..."

          docker compose \
            --env-file /home/yohanesdev/tiketapi/.env \
            up -d --remove-orphans

          # ================================================
          # STATUS
          # ================================================
          echo ""
          echo "Container status:"

          docker compose \
            --env-file /home/yohanesdev/tiketapi/.env \
            ps

          # ================================================
          # HEALTH CHECK
          # ================================================
          echo ""
          echo "Waiting for tiket-api health check..."

          for i in {1..30}; do

            STATUS=$(docker inspect \
              --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}no-healthcheck{{end}}' \
              tiket-api)

            echo "Attempt $i/30: $STATUS"

            if [ "$STATUS" = "healthy" ]; then
              echo ""
              echo "======================================"
              echo "Deploy OK"
              echo "======================================"

              exit 0
            fi

            if [ "$STATUS" = "unhealthy" ]; then
              echo ""
              echo "Health check failed"

              echo ""
              echo "Container logs:"

              docker logs --tail 100 tiket-api

              exit 1
            fi

            sleep 2
          done

          echo ""
          echo "Health check timeout"

          echo ""
          echo "Container logs:"

          docker logs --tail 100 tiket-api

          exit 1
